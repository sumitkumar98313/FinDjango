{% extends 'tracker/base.html' %}
{% block title %}Login — FinDjango{% endblock %}

{% block content %}

<div style="max-width:420px; margin:0 auto;">

  <h1 class="page-title">Welcome back</h1>
  <p class="page-subtitle">Log in to your FinDjango account</p>

  <div class="card">
    <form method="POST" novalidate>
      {% csrf_token %}

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username"
               value="{{ request.POST.username }}" autocomplete="username" required autofocus />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <!-- password field with show/hide toggle -->
        <div style="position:relative;">
          <input type="password" id="password" name="password" placeholder="Enter your password"
                 autocomplete="current-password" required style="padding-right:48px;" />
          <button type="button" id="togglePassword"
                  style="position:absolute; right:14px; top:50%; transform:translateY(-50%);
                         background:none; border:none; cursor:pointer; font-size:1rem;
                         color:var(--muted); padding:0;">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Login →</button>
    </form>
  </div>

  <!-- link to signup page -->
  <p class="text-muted" style="text-align:center; margin-top:20px;">
    Don't have an account?
    <a href="{% url 'signup' %}" style="color:var(--accent); font-weight:500;">Sign up here</a>
  </p>

</div>

<script>
  var toggleBtn = document.getElementById('togglePassword');
  var passInput = document.getElementById('password');

  // toggle between showing and hiding password
  toggleBtn.addEventListener('click', function() {
    if (passInput.type === 'password') {
      passInput.type = 'text';
      toggleBtn.textContent = '🙈';
    } else {
      passInput.type = 'password';
      toggleBtn.textContent = '👁';
    }
  });
</script>

{% endblock %}
