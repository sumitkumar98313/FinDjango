<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}FinDjango{% endblock %}</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- Chart.js for graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    /* reset - removes default browser spacing */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* css variables - all colors in one place */
    :root {
      --bg: #042f2e;
      --surface: #134e4a;
      --border: rgba(45,212,191,0.15);
      --accent: #2dd4bf;
      --accent-d: #14b8a6;
      --green: #4ade80;
      --red: #f87171;
      --text: #f0fdfa;
      --muted: #99f6e4;
      --dim: #5eead4;
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* remove underlines from links */
    a {
      text-decoration: none;
      color: inherit;
    }

    /* =================================
       NAVBAR
    ================================= */

    nav {
      background: #021a19;
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* site logo/brand */
    .nav-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    /* "Django" part of logo stays white */
    .nav-brand span {
      color: var(--text);
    }

    /* nav links container */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .nav-links a:hover {
      color: var(--text);
      background: rgba(45,212,191,0.1);
    }

    /* active/current page link */
    .nav-links a.active {
      color: #042f2e;
      background: var(--accent);
      font-weight: 600;
    }

    /* logout button */
    .nav-links form {
      margin: 0;
    }

    .nav-links form button {
      color: var(--red);
      background: none;
      border: 1px solid rgba(248,113,113,0.3);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }

    .nav-links form button:hover {
      background: rgba(248,113,113,0.1);
    }

    /* =================================
       PAGE WRAPPER
    ================================= */

    /* centered content area */
    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    /* =================================
       DJANGO MESSAGES (alerts)
    ================================= */

    .messages {
      list-style: none;
      margin-bottom: 24px;
    }

    .messages li {
      padding: 12px 18px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: 500;
    }

    /* green success message */
    .messages .success {
      background: rgba(74,222,128,0.1);
      color: var(--green);
      border: 1px solid rgba(74,222,128,0.2);
    }

    /* red error message */
    .messages .error {
      background: rgba(248,113,113,0.1);
      color: var(--red);
      border: 1px solid rgba(248,113,113,0.2);
    }

    /* teal info message */
    .messages .info {
      background: rgba(45,212,191,0.1);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    /* =================================
       CARD COMPONENT
    ================================= */

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }

    /* =================================
       TYPOGRAPHY
    ================================= */

    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .page-subtitle {
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    /* =================================
       FORM STYLES
    ================================= */

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* shared styles for all input types */
    .form-group input,
    .form-group select,
    .form-group textarea,
    .form-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      outline: none;
    }

    /* teal border when focused */
    .form-group input:focus,
    .form-group select:focus,
    .form-input:focus {
      border-color: var(--accent);
    }

    .form-group select option,
    .form-input option {
      background: var(--surface);
    }

    /* =================================
       BUTTONS
    ================================= */

    /* base button */
    .btn {
      display: inline-block;
      padding: 11px 24px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    /* main teal button */
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-primary:hover {
      background: var(--accent-d);
      transform: translateY(-1px);
    }

    /* outline button */
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(45,212,191,0.1);
    }

    /* red danger button */
    .btn-danger {
      background: #f87171;
      color: #fff;
      border: none;
    }

    .btn-danger:hover {
      background: #ef4444;
    }

    /* =================================
       AVATAR
    ================================= */

    .avatar {
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    /* different sizes */
    .avatar-lg { width: 80px; height: 80px; }
    .avatar-sm { width: 36px; height: 36px; }

    /* shown when no profile picture */
    .avatar-placeholder {
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* =================================
       STAT CARDS
    ================================= */

    .stat-card { text-align: center; }
    .stat-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; line-height: 1; }
    .stat-sub { font-size: 0.8rem; margin-top: 4px; }

    /* =================================
       TRANSACTION ROW
    ================================= */

    .tx-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
    .tx-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .tx-name { font-weight: 500; font-size: 0.9rem; }
    .tx-meta { font-size: 0.78rem; color: var(--muted); }
    .tx-amount { font-family: 'Syne', sans-serif; font-weight: 700; }
    .section-head { font-family: 'Syne', sans-serif; font-weight: 700; margin-bottom: 20px; }

    /* divider line */
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* helper classes */
    .text-muted { color: var(--muted); font-size: 0.9rem; }
    .text-accent { color: var(--accent); }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }

    /* =================================
       RESPONSIVE - MOBILE
    ================================= */

    @media (max-width: 768px) {
      /* stack two column layouts on mobile */
      .two-col { grid-template-columns: 1fr !important; }
    }

    @media (max-width: 600px) {
      nav { padding: 12px 16px; height: auto; }
      .nav-links a { padding: 6px 10px; font-size: 0.8rem; }
      .page-wrapper { padding: 28px 16px; }
      .page-title { font-size: 1.5rem; }
      .card { padding: 20px; }
    }

  </style>
</head>
<body>

<!-- navbar -->
<nav>
  <a href="{% url 'home' %}" class="nav-brand">Fin<span>Django</span></a>

  <div class="nav-links">
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
      <a href="{% url 'transactions' %}" {% if request.resolver_match.url_name == 'transactions' %}class="active"{% endif %}>Transactions</a>
      <a href="{% url 'add_transaction' %}" {% if request.resolver_match.url_name == 'add_transaction' %}class="active"{% endif %}>+ Add</a>
      <a href="{% url 'monthly_report' %}" {% if request.resolver_match.url_name == 'monthly_report' %}class="active"{% endif %}>Report</a>
      <a href="{% url 'profile' %}" {% if request.resolver_match.url_name == 'profile' %}class="active"{% endif %}>Profile</a>
      <!-- logout uses POST for security -->
      <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" {% if request.resolver_match.url_name == 'login' %}class="active"{% endif %}>Login</a>
      <a href="{% url 'signup' %}" {% if request.resolver_match.url_name == 'signup' %}class="active"{% endif %}>Sign Up</a>
    {% endif %}
  </div>
</nav>

<!-- main content area -->
<div class="page-wrapper">

  <!-- show django messages if any -->
  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  {% block content %}{% endblock %}

</div>

</body>
</html>
